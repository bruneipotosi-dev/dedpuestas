services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Servicio de desarrollo local: imagen oficial de Node + código montado como
  # volumen, sin Dockerfile propio (ver TODO.md — el Dockerfile de producción
  # lo escribís vos). Cuando lo tengas, reemplazá "image" por "build: ." para
  # probar esa imagen real en local antes de subirla a GHCR.
  app:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?schema=public
      SESSION_SECRET: ${SESSION_SECRET}
      NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${NEXT_PUBLIC_TURNSTILE_SITE_KEY}
      TURNSTILE_SECRET_KEY: ${TURNSTILE_SECRET_KEY}
      NODE_ENV: development
      # Turbopack (next dev) no resuelve bien la ruta del motor de Prisma
      # cuando el cliente generado vive fuera de node_modules/.prisma (acá
      # vive en src/generated/prisma). Se lo indicamos directo para evitar
      # el "could not locate the Query Engine".
      PRISMA_QUERY_ENGINE_LIBRARY: /app/src/generated/prisma/libquery_engine-linux-musl-openssl-3.0.x.so.node
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - app_node_modules:/app/node_modules
      # El contenedor corre como root y escribe acá; sin esto, esas escrituras
      # quedan en tu carpeta del host con dueño root y no podés borrarlas.
      - app_next_cache:/app/.next
    depends_on:
      db:
        condition: service_healthy

volumes:
  db_data:
  app_node_modules:
  app_next_cache:
